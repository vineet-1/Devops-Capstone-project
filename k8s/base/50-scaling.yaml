apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: taskapi-stable, namespace: taskapi }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: taskapi-stable }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: taskapi, namespace: taskapi }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: taskapi } }
