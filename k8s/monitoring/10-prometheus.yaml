apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: monitoring }
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    alerting:
      alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]
    rule_files: [/etc/prometheus/rules.yml]
    scrape_configs:
      - job_name: prometheus
        static_configs: [{ targets: ["localhost:9090"] }]
      - job_name: taskapi
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [taskapi] } }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
          - { source_labels: [__meta_kubernetes_pod_label_track], target_label: track }
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
  rules.yml: |
    groups:
      - name: taskapi-slo
        rules:
          - record: taskapi:error_ratio:rate1m
            expr: sum by (track) (rate(http_requests_total{status=~"5.."}[1m])) / sum by (track) (rate(http_requests_total[1m]))
          - record: taskapi:latency_p95:rate1m
            expr: histogram_quantile(0.95, sum by (track, le) (rate(http_request_duration_seconds_bucket[1m])))
          - alert: TaskApiHighErrorRate
            expr: taskapi:error_ratio:rate1m > 0.05
            for: 30s
            labels: { severity: critical }
            annotations: { summary: "{{ $labels.track }} error rate {{ $value | humanizePercentage }} > 5%" }
          - alert: TaskApiHighLatency
            expr: taskapi:latency_p95:rate1m > 0.5
            for: 1m
            labels: { severity: warning }
            annotations: { summary: "{{ $labels.track }} p95 latency {{ $value }}s > 500ms" }
          - alert: TaskApiTargetDown
            expr: up{job="taskapi"} == 0
            for: 30s
            labels: { severity: critical }
            annotations: { summary: "pod {{ $labels.pod }} is not being scraped" }
          - alert: TaskApiNoStableReplicas
            expr: count(up{job="taskapi", track="stable"} == 1) < 2
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "fewer than 2 healthy stable pods" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          command: ["/bin/prometheus"]
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
          ports: [{ containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: 9090 } }
          resources: { requests: { cpu: 100m, memory: 200Mi }, limits: { memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
