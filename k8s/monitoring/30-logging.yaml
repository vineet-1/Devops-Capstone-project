apiVersion: v1
kind: ConfigMap
metadata: { name: loki-config, namespace: monitoring }
data:
  loki.yaml: |
    auth_enabled: false
    server: { http_listen_port: 3100 }
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: { kvstore: { store: inmemory } }
      storage: { filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules } }
    schema_config:
      configs:
        - { from: "2024-01-01", store: tsdb, object_store: filesystem, schema: v13, index: { prefix: index_, period: 24h } }
    limits_config: { retention_period: 168h, allow_structured_metadata: true }
    analytics: { reporting_enabled: false }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          command: ["/usr/bin/loki"]
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{ containerPort: 3100 }]
          readinessProbe: { httpGet: { path: /ready, port: 3100 }, initialDelaySeconds: 10 }
          resources: { limits: { memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - { name: config, configMap: { name: loki-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: monitoring }
spec:
  selector: { app: loki }
  ports: [{ port: 3100, targetPort: 3100 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: promtail-config, namespace: monitoring }
data:
  promtail.yaml: |
    server: { http_listen_port: 9080, grpc_listen_port: 0 }
    positions: { filename: /run/promtail/positions.yaml }
    clients: [{ url: "http://loki:3100/loki/api/v1/push" }]
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{ role: pod }]
        pipeline_stages:
          - cri: {}
          - docker: {}
          - json: { expressions: { level: level, version: version } }
          - labels: { level: "", version: "" }
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_node_name], target_label: __host__ }
          - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
          - { source_labels: [__meta_kubernetes_pod_container_name], target_label: container }
          - { source_labels: [__meta_kubernetes_pod_label_app], target_label: app }
          - { source_labels: [__meta_kubernetes_pod_label_track], target_label: track }
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: promtail, namespace: monitoring }
spec:
  selector: { matchLabels: { app: promtail } }
  template:
    metadata: { labels: { app: promtail } }
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.3.2
          command: ["/usr/bin/promtail"]
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          env: [{ name: HOSTNAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }]
          resources: { limits: { memory: 256Mi } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: run, mountPath: /run/promtail }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
            - { name: docker, mountPath: /var/lib/docker/containers, readOnly: true }
      volumes:
        - { name: config, configMap: { name: promtail-config } }
        - { name: run, hostPath: { path: /run/promtail } }
        - { name: pods, hostPath: { path: /var/log/pods } }
        - { name: docker, hostPath: { path: /var/lib/docker/containers } }
