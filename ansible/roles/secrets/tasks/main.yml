# Secrets flow: vault (source of truth) -> short-lived AppRole token -> Kubernetes Secret. Never in Git.
- name: Bootstrap vault (init/unseal/engines/policy/approle, idempotent)
  ansible.builtin.command: "{{ repo_root }}/vault/bootstrap.sh"
  register: vault_boot
  changed_when: "'generated' in vault_boot.stdout or 'initialised' in vault_boot.stdout"
- name: Read root token for issuing a one-time secret_id (admin step)
  ansible.builtin.slurp: { src: "{{ repo_root }}/vault/init.json" }
  register: init_json
  no_log: true
- name: Get AppRole role_id and a single-use secret_id
  ansible.builtin.shell: |
    export BAO_ADDR={{ vault_addr }} BAO_TOKEN={{ (init_json.content | b64decode | from_json).root_token }}
    echo "$(bao read -field=role_id auth/approle/role/deployer/role-id) $(bao write -f -field=secret_id auth/approle/role/deployer/secret-id)"
  register: approle
  changed_when: false
  no_log: true
- name: Log in as the deployer (least privilege, 10 min TTL)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body: { role_id: "{{ approle.stdout.split()[0] }}", secret_id: "{{ approle.stdout.split()[1] }}" }
  register: login
  no_log: true
- name: Fetch database credentials from the vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/taskapi/db"
    headers: { X-Vault-Token: "{{ login.json.auth.client_token }}" }
  register: dbsecret
  no_log: true
- name: Ensure namespace exists
  ansible.builtin.shell: kubectl create namespace {{ namespace }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false
- name: Create/update Kubernetes Secret from vault data
  ansible.builtin.shell: |
    kubectl -n {{ namespace }} create secret generic taskapi-db \
      --from-literal=username='{{ dbsecret.json.data.data.username }}' \
      --from-literal=password='{{ dbsecret.json.data.data.password }}' \
      --dry-run=client -o yaml | kubectl apply -f -
  register: k8s_secret
  changed_when: "'configured' in k8s_secret.stdout or 'created' in k8s_secret.stdout"
  no_log: true
- name: Revoke the deployer token
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/token/revoke-self"
    method: POST
    headers: { X-Vault-Token: "{{ login.json.auth.client_token }}" }
    status_code: [200, 204]
  no_log: true
