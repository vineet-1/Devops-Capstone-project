- name: Check whether k3s is installed
  ansible.builtin.stat: { path: /usr/local/bin/k3s }
  register: k3s_bin
- name: Download k3s binary (checksum verified)
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s"
    checksum: "sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/sha256sum-amd64.txt"
    dest: /usr/local/bin/k3s
    mode: "0755"
  when: not k3s_bin.stat.exists
- name: Link kubectl to k3s
  ansible.builtin.file: { src: /usr/local/bin/k3s, dest: /usr/local/bin/kubectl, state: link }
- name: Check whether the cluster API is up
  ansible.builtin.command: kubectl get --raw /readyz
  register: api
  changed_when: false
  failed_when: false
- name: Start k3s server (Docker runtime, Traefik ingress, metrics-server; locally built images are protected from GC)
  ansible.builtin.shell: >
    nohup k3s server --docker --disable=servicelb --write-kubeconfig-mode=644
    --kubelet-arg=image-gc-high-threshold=100 --kubelet-arg=image-gc-low-threshold=99
    --kubelet-arg=eviction-hard=nodefs.available<1Gi,imagefs.available<1Gi
    > /var/log/k3s.log 2>&1 &
  when: api.rc != 0
- name: Wait for node to be Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
- name: Wait for Traefik CRDs (used for weighted canary routing)
  ansible.builtin.command: kubectl wait --for=condition=Established crd/traefikservices.traefik.io --timeout=180s
  changed_when: false
