# Zero-trust networking: deny all ingress, then allow only required flows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: taskapi }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-app-from-ingress-and-monitoring, namespace: taskapi }
spec:
  podSelector: { matchLabels: { app: taskapi } }
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-db-from-app-and-backup, namespace: taskapi }
spec:
  podSelector: { matchLabels: { app: postgres } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: taskapi } }
        - podSelector: { matchLabels: { app: db-backup } }
      ports: [{ port: 5432 }]
