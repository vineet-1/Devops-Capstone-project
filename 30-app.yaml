# Two Deployments of the same app: "stable" serves most traffic, "canary" receives a weighted share.
# Pods carry a "track" label so Prometheus can compare stable vs canary during rollouts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi-stable
  namespace: taskapi
  labels: { app: taskapi, track: stable }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: taskapi, track: stable } }
  template:
    metadata:
      labels: { app: taskapi, track: stable }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      serviceAccountName: taskapi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: taskapi } } }
      containers:
        - name: taskapi
          image: ghcr.io/masterjod/taskapi:1.0.0
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: taskapi-config } }]
          env:
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: taskapi-db, key: username } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: taskapi-db, key: password } } }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 30 }
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi-canary
  namespace: taskapi
  labels: { app: taskapi, track: canary }
spec:
  replicas: 0          # scaled up only during a rollout by scripts/canary_rollout.py
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: taskapi, track: canary } }
  template:
    metadata:
      labels: { app: taskapi, track: canary }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000" }
    spec:
      serviceAccountName: taskapi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: taskapi } } }
      containers:
        - name: taskapi
          image: ghcr.io/masterjod/taskapi:1.0.0
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: taskapi-config } }]
          env:
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: taskapi-db, key: username } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: taskapi-db, key: password } } }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)" }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 30 }
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: taskapi-canary, namespace: taskapi }
spec:
  selector: { app: taskapi, track: canary }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: taskapi-stable, namespace: taskapi }
spec:
  selector: { app: taskapi, track: stable }
  ports: [{ name: http, port: 80, targetPort: http }]
